[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buy-or-wait"
version = "1.0.0"
description = "Deterministic financial affordability BUY OR WAIT agent"
requires-python = ">=3.11"

[project.scripts]
buy-or-wait = "buy_or_wait.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
